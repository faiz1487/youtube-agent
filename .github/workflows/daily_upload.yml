name: Daily YouTube AI Music Agent

on:
  # Schedule to run automatically every day at 14:00 UTC (9:00 AM EST / 19:30 IST)
  schedule:
    - cron: '0 14 * * *'

  # Allows manual execution anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      genre:
        description: 'Music Genre (leave empty for automatic rotation)'
        required: false
        type: string
        default: ''
      theme:
        description: 'Specific song theme or story concept'
        required: false
        type: string
        default: ''
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: 'public'
      dry_run:
        description: 'Run in Dry-Run mode (tests pipeline without spending credits or uploading)'
        required: false
        type: boolean
        default: false

jobs:
  compose_and_publish:
    name: Generate Music & Publish to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Music Agent Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          GENERATE_AI_COVER: ${{ secrets.GENERATE_AI_COVER || 'true' }}

          SUNO_MODE: ${{ secrets.SUNO_MODE || 'cookie' }}
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
          SUNO_API_URL: ${{ secrets.SUNO_API_URL }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}

          MUSIC_GENRES: ${{ secrets.MUSIC_GENRES }}
        run: |
          CMD_ARGS=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi

          if [ -n "${{ github.event.inputs.genre }}" ]; then
            CMD_ARGS="$CMD_ARGS --genre '${{ github.event.inputs.genre }}'"
          fi

          if [ -n "${{ github.event.inputs.theme }}" ]; then
            CMD_ARGS="$CMD_ARGS --theme '${{ github.event.inputs.theme }}'"
          fi

          if [ -n "${{ github.event.inputs.privacy }}" ]; then
            CMD_ARGS="$CMD_ARGS --privacy ${{ github.event.inputs.privacy }}"
          fi

          echo "Executing: python src/main.py $CMD_ARGS"
          eval python src/main.py $CMD_ARGS

      - name: Upload Output Artifacts (Logs & Thumbnails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-upload-artifacts
          path: |
            temp/cover_art.png
          retention-days: 7
