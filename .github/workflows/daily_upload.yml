name: Daily YouTube AI Music Agent

on:
  # Runs daily automatically at 14:00 UTC (19:30 IST / 7:30 PM India Time)
  schedule:
    - cron: '0 14 * * *'

  # Allows manual execution anytime from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (simulation test without uploading)'
        required: false
        type: boolean
        default: false
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: 'public'

permissions:
  contents: write

jobs:
  compose_and_publish:
    name: Generate Music & Publish to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Music Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          GENERATE_AI_COVER: 'true'

          SUNO_MODE: ${{ secrets.SUNO_MODE || 'cookie' }}
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
          SUNO_API_URL: ${{ secrets.SUNO_API_URL }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}

          MUSIC_GENRES: ${{ secrets.MUSIC_GENRES }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running Dry-Run test simulation..."
            python src/main.py --dry-run
          else
            echo "Running Daily Autonomous Publisher..."
            python src/daily_publisher.py
          fi

      - name: Commit and Push Published History
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --staged --quiet || (git commit -m "chore: record daily published song [skip ci]" && git push)

      - name: Upload Output Artifacts (Logs & Thumbnails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-upload-artifacts
          path: |
            temp/thumb_*.png
            output/*.mp4
          retention-days: 7
